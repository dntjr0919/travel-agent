<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#006762" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/static/icons/favicon.png">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Travel Planner" />
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
  <title>{% block title %}Travel Planner{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css?v={{ static_v('static/css/app.css') }}" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/trips">Travel Planner</a>
    <nav class="topbar-nav" aria-label="주요 메뉴">
      <div class="nav-guest-links">
        <a href="/login">로그인</a>
        <a href="/register">회원가입</a>
      </div>
      <span id="nav-user" class="nav-user"></span>
      <button id="nav-logout" class="link-button" style="display:none">로그아웃</button>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/js/app.js?v={{ static_v('static/js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
