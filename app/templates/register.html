{% extends "base.html" %}
{% block title %}회원가입 - Travel Planner{% endblock %}
{% block content %}
<div class="card narrow auth-card">
  <h1>회원가입</h1>
  <form id="register-form" class="form">
    <label>이메일
      <input type="email" name="email" required />
    </label>
    <label>표시 이름
      <input type="text" name="display_name" required maxlength="100" />
    </label>
    <label>비밀번호
      <input type="password" name="password" required minlength="8" />
    </label>
    <button type="submit">가입하기</button>
  </form>
  <p id="register-error" class="error-text"></p>
  <p>이미 계정이 있나요? <a href="/login">로그인</a></p>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById("register-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  const errorEl = document.getElementById("register-error");
  errorEl.textContent = "";
  const payload = {
    email: form.email.value,
    display_name: form.display_name.value,
    password: form.password.value,
  };
  const res = await apiFetch("/api/auth/register", { method: "POST", body: JSON.stringify(payload) });
  if (res.ok) {
    window.location.href = "/trips";
  } else {
    const data = await res.json().catch(() => ({}));
    errorEl.textContent = data.detail || "회원가입에 실패했습니다.";
  }
});
</script>
{% endblock %}
