{% extends "base.html" %}
{% block title %}새 여행 - Travel Planner{% endblock %}
{% block content %}
<section class="trip-form-page">
  <header class="page-header trip-form-header">
    <div>
      <p class="trip-page-eyebrow">여행 플래너</p>
      <h1>새 여행 만들기</h1>
      <p class="trip-form-description">여행 정보를 입력해 새로운 계획을 시작하세요.</p>
    </div>
  </header>
  <div class="card narrow trip-form-card">
    <form id="trip-form" class="form">
      <label>제목
        <input type="text" name="title" required maxlength="200" />
      </label>
      <label>여행지
        <input type="text" name="destination" maxlength="200" />
      </label>
      <div class="trip-form-date-grid">
        <label>시작일
          <input type="date" id="trip-start-date" name="start_date" required />
        </label>
        <label>종료일
          <input type="date" id="trip-end-date" name="end_date" required />
        </label>
      </div>
      <label>시간대
        <input type="text" name="timezone" value="Asia/Seoul" required />
      </label>
      <button class="trip-form-submit" type="submit">여행 생성</button>
    </form>
    <p id="trip-error" class="error-text trip-form-error" role="alert" aria-live="polite"></p>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script>
requireLogin();
const tripStartDateInput = document.getElementById("trip-start-date");
const tripEndDateInput = document.getElementById("trip-end-date");

tripStartDateInput.addEventListener("change", () => {
  if (tripStartDateInput.value) {
    tripEndDateInput.value = tripStartDateInput.value;
  }
});
document.getElementById("trip-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  const errorEl = document.getElementById("trip-error");
  errorEl.textContent = "";
  const payload = {
    title: form.title.value,
    destination: form.destination.value || null,
    start_date: form.start_date.value,
    end_date: form.end_date.value,
    timezone: form.timezone.value,
  };
  const res = await apiFetch("/api/trips", { method: "POST", body: JSON.stringify(payload) });
  const data = await res.json().catch(() => ({}));
  if (res.ok) {
    window.location.href = `/trips/${data.id}`;
  } else {
    errorEl.textContent = data.detail || "여행 생성에 실패했습니다.";
  }
});
</script>
{% endblock %}
