{% extends "base.html" %}
{% block title %}비밀번호 재설정 요청 - Travel Planner{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>비밀번호 찾기</h1>
  <p class="muted">가입한 이메일을 입력하면 개발용 재설정 링크를 발급해 드립니다. (실제 이메일 발송은 하지 않습니다)</p>
  <form id="forgot-form" class="form">
    <label>이메일
      <input type="email" name="email" required />
    </label>
    <button type="submit">재설정 링크 받기</button>
  </form>
  <p id="forgot-error" class="error-text"></p>
  <div id="forgot-result" class="invite-result" style="display:none">
    <p id="forgot-message"></p>
    <code id="reset-url"></code>
  </div>
  <p><a href="/login">로그인으로 돌아가기</a></p>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById("forgot-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  const errorEl = document.getElementById("forgot-error");
  errorEl.textContent = "";
  const payload = { email: form.email.value };
  const res = await apiFetch("/api/auth/password-reset/request", { method: "POST", body: JSON.stringify(payload) });
  const data = await res.json().catch(() => ({}));
  if (res.ok) {
    document.getElementById("forgot-result").style.display = "block";
    document.getElementById("forgot-message").textContent = data.detail;
    document.getElementById("reset-url").textContent = data.reset_url || "(가입된 이메일이 아니면 링크가 발급되지 않습니다)";
  } else {
    errorEl.textContent = data.detail || "요청에 실패했습니다.";
  }
});
</script>
{% endblock %}
