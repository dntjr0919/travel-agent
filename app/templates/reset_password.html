{% extends "base.html" %}
{% block title %}비밀번호 재설정 - Travel Planner{% endblock %}
{% block content %}
<div class="card narrow auth-card">
  <h1>새 비밀번호 설정</h1>
  <form id="reset-form" class="form">
    <label>새 비밀번호
      <input type="password" name="new_password" required minlength="8" />
    </label>
    <label>새 비밀번호 확인
      <input type="password" name="confirm_password" required minlength="8" />
    </label>
    <button type="submit">비밀번호 변경</button>
  </form>
  <p id="reset-error" class="error-text"></p>
  <p id="reset-success" class="muted" style="display:none">비밀번호가 변경되었습니다. <a href="/login">로그인하러 가기</a></p>
</div>
{% endblock %}
{% block scripts %}
<script>
const TOKEN = "{{ token }}";

document.getElementById("reset-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  const errorEl = document.getElementById("reset-error");
  errorEl.textContent = "";

  if (form.new_password.value !== form.confirm_password.value) {
    errorEl.textContent = "비밀번호가 일치하지 않습니다.";
    return;
  }

  const payload = { token: TOKEN, new_password: form.new_password.value };
  const res = await apiFetch("/api/auth/password-reset/confirm", { method: "POST", body: JSON.stringify(payload) });
  if (res.ok) {
    form.style.display = "none";
    document.getElementById("reset-success").style.display = "block";
  } else {
    const data = await res.json().catch(() => ({}));
    errorEl.textContent = data.detail || "재설정에 실패했습니다.";
  }
});
</script>
{% endblock %}
